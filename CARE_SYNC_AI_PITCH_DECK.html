<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareSync Clinical AI — 10-Slide Startup Pitch & Defense Deck</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #0f172a;
      --border: #1e293b;
      --primary: #0284c7;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .slide-container {
      width: 100%;
      max-width: 1080px;
      min-height: 620px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .slide-header {
      background: #020617;
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slide-badge {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .slide-counter {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      font-family: monospace;
    }
    .slide-content {
      flex: 1;
      padding: 2.25rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    h1 {
      font-size: 1.95rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      line-height: 1.2;
    }
    .subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-top: 0.25rem;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .metric-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .metric-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .metric-val {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--accent);
      margin-top: 0.35rem;
      display: block;
      font-family: monospace;
    }
    .points-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .point-item {
      display: flex;
      gap: 1rem;
      background: rgba(2, 6, 23, 0.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.95rem 1.25rem;
      align-items: flex-start;
    }
    .point-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid var(--primary);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .point-title {
      font-size: 0.925rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.2rem;
    }
    .point-desc {
      font-size: 0.825rem;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .speaker-box {
      background: rgba(2, 132, 199, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }
    .speaker-label {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: block;
      margin-bottom: 0.4rem;
    }
    .speaker-text {
      font-size: 0.85rem;
      color: #e2e8f0;
      font-style: italic;
      line-height: 1.55;
    }
    .slide-footer {
      background: #020617;
      border-top: 1px solid var(--border);
      padding: 1rem 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    button {
      background: #1e293b;
      color: #ffffff;
      border: 1px solid #334155;
      padding: 0.55rem 1.25rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.825rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.15s ease;
    }
    button:hover:not(:disabled) {
      background: var(--primary);
      border-color: var(--primary);
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .nav-dots {
      display: flex;
      gap: 0.4rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #334155;
      cursor: pointer;
      transition: all 0.2s;
    }
    .dot.active {
      background: var(--primary);
      width: 24px;
      border-radius: 5px;
    }
    @media print {
      body { background: white; color: black; padding: 0; }
      .slide-container { border: none; box-shadow: none; page-break-after: always; min-height: 100vh; }
      .slide-footer, button { display: none; }
    }
  </style>
</head>
<body>

  <div class="slide-container">
    <div class="slide-header">
      <span class="slide-badge" id="slide-category">Category</span>
      <div class="slide-counter" id="slide-num">Slide 1 of 10</div>
    </div>

    <div class="slide-content">
      <div>
        <h1 id="slide-title">Title</h1>
        <p class="subtitle" id="slide-subtitle">Subtitle</p>
      </div>

      <div class="metrics-grid" id="slide-metrics"></div>

      <div class="points-list" id="slide-points"></div>

      <div class="speaker-box">
        <span class="speaker-label">🎙️ Verbatim 30-Second Speaker Script:</span>
        <p class="speaker-text" id="slide-script"></p>
      </div>
    </div>

    <div class="slide-footer">
      <button id="prev-btn" onclick="prevSlide()">← Previous</button>
      <div class="nav-dots" id="dots-container"></div>
      <button id="next-btn" onclick="nextSlide()">Next Slide →</button>
    </div>
  </div>

  <script>
    const SLIDES = [
      {
        id: 1,
        category: 'EXECUTIVE DEFENSE',
        title: 'CareSync Clinical AI',
        subtitle: 'Autonomous Multimodal Tele-Triage & Optical Biomarker Telemetry for Rural Primary Healthcare',
        metrics: [
          { label: 'Compute Footprint', val: '100% Offline Edge' },
          { label: 'Decision Latency', val: '< 12ms Real-Time' },
          { label: 'Binary Footprint', val: '291 KB Production' },
          { label: 'GPU Dependency', val: 'Zero ($0 Server Cost)' }
        ],
        points: [
          { title: 'Final Year Engineering Capstone', desc: 'Engineered specifically for rural Primary Health Centres (PHCs) with unstable power and zero broadband.' },
          { title: 'Dual-Modality Integration', desc: 'Unifies non-contact web camera optical vital extraction (rPPG) with continuous Bayesian belief networks.' },
          { title: 'Verifiable Patient Safety', desc: 'Features deterministic allergy interception and automated SBAR clinical transfer handoffs.' }
        ],
        script: 'Respected evaluators: Millions in rural communities suffer preventable complications from acute infections, respiratory failure, and cardiac emergencies due to delayed triage. We present CareSync Clinical AI—a startup-grade, edge-computable tele-triage platform that extracts non-contact optical vital signs via standard webcams and executes continuous Bayesian clinical decision support in under 12 milliseconds entirely in-browser.'
      },
      {
        id: 2,
        category: 'CLINICAL PROBLEM STATEMENT',
        title: 'The Rural Triage Bottleneck',
        subtitle: 'Severe Specialist Scarcity and Fatal Diagnostic Delays in Primary Health Centres',
        metrics: [
          { label: 'Rural Doctor-Patient Ratio', val: '1 : 25,000' },
          { label: 'Average Triage Delay', val: '4.2 Hours' },
          { label: 'Preventable Mortality Rate', val: '38% Rural vs 14% Urban' }
        ],
        points: [
          { title: 'Hardware Sensor Deficiency', desc: 'Multi-parameter patient monitors cost $500–$2,000 per unit, require consumable probes, and suffer constant battery breakdown.' },
          { title: 'Failure of Cloud LLM Solutions', desc: 'Cloud GenAI models fail during rural network blackouts, incur 3–5s network latency, and hallucinate fatal contraindicated medications.' },
          { title: 'Data Privacy & Regulatory Restrictions', desc: 'HIPAA and India DISHA policies strictly restrict streaming raw patient biometric facial video across third-party remote cloud servers.' }
        ],
        script: 'Primary Health Centres lack both specialist physicians and diagnostic equipment. When a patient arrives in distress, health workers must make critical referral decisions without objective telemetry. Existing cloud AI tools fail here: they are slow, prone to dangerous hallucinations, and cannot operate without stable high-speed internet.'
      },
      {
        id: 3,
        category: 'MARKET OPPORTUNITY & POLICY',
        title: 'Market Validation & Policy Alignment',
        subtitle: 'Positioned at the Intersection of Digital Health Missions and Underserved Primary Care',
        metrics: [
          { label: 'Global TAM (Telehealth)', val: '$42.8 Billion' },
          { label: 'Target SAM (India PHCs)', val: '31,000+ Centres' },
          { label: 'Target Cost Reduction', val: '98% vs Monitor Hardware' }
        ],
        points: [
          { title: 'Ayushman Bharat Digital Mission (ABDM)', desc: 'Seamless interoperability via ABHA health ID linkages and standardized electronic clinical referral summaries.' },
          { title: 'WHO IMCI Guidelines Adherence', desc: 'Mathematical likelihood priors are calibrated against WHO Integrated Management of Childhood/Adult Illness clinical protocols.' },
          { title: 'Extreme Low-Cost Scalability', desc: 'Deploys directly on pre-existing government desktop computers, tablets, or ASHA worker mobile phones without buying hardware.' }
        ],
        script: 'CareSync is engineered specifically for national digital health infrastructure. By targeting primary care sub-centres and district hospital referral pipelines, we create a high-impact, low-cost software triage layer that integrates directly into existing public health hardware.'
      },
      {
        id: 4,
        category: 'CORE IP INNOVATION 1',
        title: 'Non-Contact Optical rPPG Telemetry',
        subtitle: 'Extracting Capillary Pulse, Thoracic Motion, and Pallor from Ambient Video Streams',
        metrics: [
          { label: 'Sub-Surface Wavelength', val: '540 nm (Green)' },
          { label: 'Sampling Rate', val: '30 – 144 FPS Adaptive' },
          { label: 'Lag Window Buffer', val: '4.0 Seconds Sliding' }
        ],
        points: [
          { title: 'Green Channel Photoplethysmography Physics', desc: 'Oxygenated hemoglobin (HbO2) peak absorbance occurs at 540nm. Ventricular ejection pulses micro-vascular skin reflectance by <1%.' },
          { title: 'Dynamic YCrCb Cohesion & Centroid Tracking', desc: 'Isolates genuine dermal tissue (Cr: 134-174, Cb: 80-126) with compactness clustering to eliminate wall/ceiling false positives.' },
          { title: 'Time-Domain Autocorrelation & Optical Flow', desc: 'R(τ) lag analysis isolates pulse harmonics between 50-140 bpm, while frame-differencing across the thoracic box extracts respiratory rate.' }
        ],
        script: 'Instead of attaching physical pulse clips, CareSync uses the device optical sensor. Hemoglobin absorbs green photons at 540nm. As the heart beats, micro-vascular capillaries dilate. Our algorithm isolates facial skin using YCrCb chrominance modeling, applies time-domain autocorrelation across the green channel, and extracts heart rate and respiratory motion without contacting the patient.'
      },
      {
        id: 5,
        category: 'CORE IP INNOVATION 2',
        title: 'Continuous Gaussian Bayesian Engine',
        subtitle: 'Deterministic Mathematical Explainability with Sub-12ms In-Browser Inference',
        metrics: [
          { label: 'Inference Latency', val: '< 12 ms In-Browser' },
          { label: 'Model Architecture', val: 'Gaussian + Bernoulli Bayesian' },
          { label: 'Explainability', val: 'Exact Log-Odds Attribution' }
        ],
        points: [
          { title: 'Continuous Physiological Likelihoods', desc: 'Models continuous vitals (SpO2, Pulse, BP, Respiration, Temp) via univariate Gaussian distributions N(v_i; μ, σ²).' },
          { title: 'Discrete Bernoulli Symptom Clusters', desc: 'Integrates discrete clinical presentations (cough, rust sputum, chest pain) via independent Bernoulli conditional likelihoods.' },
          { title: 'Transparent Feature Attribution Matrix', desc: 'Clinicians see exact quantitative log-odds shifts: SpO2 86% delivers +14.2 to Lobar Pneumonia; Heart Rate 114 delivers +8.8.' }
        ],
        script: 'In emergency medicine, doctors cannot trust black boxes. CareSync implements a multi-parameter Bayesian network combining Gaussian continuous likelihoods for vitals with Bernoulli symptom likelihoods. When SpO2 drops or heart rate spikes, posterior probabilities shift in under 12 milliseconds, accompanied by an exact log-odds attribution matrix explaining why.'
      },
      {
        id: 6,
        category: 'CORE IP INNOVATION 3',
        title: 'NeMo-Style Hard Deterministic Guardrails',
        subtitle: 'Zero Tolerance for Contraindicated Drug Recommendations and AI Hallucinations',
        metrics: [
          { label: 'Safety Interception Latency', val: '0 ms (Synchronous)' },
          { label: 'Contraindication Policy', val: 'Rule-Based Interceptor' },
          { label: 'Protocol Redirection', val: 'Automated 2nd-Line Regimen' }
        ],
        points: [
          { title: 'The Fatal Medical LLM Vulnerability', desc: 'Generative LLMs frequently prescribe first-line amoxicillin to bacterial pneumonia patients even when fatal anaphylaxis is logged.' },
          { title: 'Deterministic Programmatic Interceptor', desc: 'Before any prescription or advice surfaces, inputs pass through a strict rule engine cross-referencing documented allergens.' },
          { title: 'Intelligent Protocol Substitution', desc: 'When penicillin is flagged, the system automatically redirects to Ceftriaxone IV (1g q24h) + Azithromycin PO (500mg q24h).' }
        ],
        script: 'Patient safety is non-negotiable. CareSync features a deterministic safety guardrail inspired by NVIDIA NeMo Guardrails. If our diagnostic model recommends penicillin for pneumonia, the guardrail detects documented anaphylaxis, intercepts the order, and re-routes to intravenous Ceftriaxone.'
      },
      {
        id: 7,
        category: 'STANDARDIZED CLINICAL PROTOCOL',
        title: 'Automated Triage Stratification & SBAR',
        subtitle: 'Standardized Royal College NEWS2 Scoring and 1-Click Referral Handoff Summaries',
        metrics: [
          { label: 'Clinical Score', val: 'NEWS2 (0 – 20 Scale)' },
          { label: 'Risk Stratification', val: 'Low / Medium / High' },
          { label: 'Handoff Protocol', val: 'Standardized SBAR' }
        ],
        points: [
          { title: 'Objective NEWS2 Computation', desc: 'Automatically computes clinical risk across respiration, SpO2, blood pressure, heart rate, consciousness, and temperature.' },
          { title: 'Standardized SBAR Referral Sheet', desc: 'Generates structured Situation, Background, Assessment, and Recommendation reports for seamless ambulance and tertiary referral.' },
          { title: 'Reduces Medical Communication Errors', desc: 'Standardized documentation eliminates verbal referral omissions that account for over 60% of rural transport complications.' }
        ],
        script: 'When a rural patient must be transferred, verbal miscommunication causes medical errors. CareSync calculates the internationally standardized NEWS2 score and generates a 1-click SBAR transfer report, creating a verifiable clinical audit trail for tertiary hospital handoff.'
      },
      {
        id: 8,
        category: 'HARDWARE & LATENCY BENCHMARKS',
        title: 'Empirical Edge Performance Benchmarks',
        subtitle: 'Quantitative Comparison: Cloud LLMs vs Edge SLMs vs CareSync Architecture',
        metrics: [
          { label: 'Cloud LLM Latency', val: '3,200 ms (2.5 Mbps)' },
          { label: 'Edge SLM Latency', val: '180 ms (2.3 GB RAM)' },
          { label: 'CareSync Latency', val: '< 12 ms (< 15 MB RAM)' }
        ],
        points: [
          { title: 'Zero Cloud Egress Architecture', desc: 'Patient video frames and health records stay strictly inside volatile RAM; zero raw frames are sent over the internet.' },
          { title: 'Universal Hardware Compatibility', desc: 'Runs at smooth 30 to 144 FPS on any standard browser across $100 budget laptops, Chromebooks, and low-cost tablets.' },
          { title: 'Zero Operating Cost', desc: 'By eliminating cloud API tokens and dedicated GPU server instances, marginal operational cost per patient triage is $0.00.' }
        ],
        script: 'Our entire platform compiles to a 291 KB bundle. As demonstrated in our benchmark comparison, while cloud models take over 3 seconds and require stable broadband, CareSync executes in under 12 milliseconds using less than 15 megabytes of RAM on any standard device.'
      },
      {
        id: 9,
        category: 'COMPETITIVE ADVANTAGE',
        title: 'Competitive Moat & Technical Defensibility',
        subtitle: 'Why Conventional Telemedicine and AI Chatbots Cannot Match CareSync',
        metrics: [
          { label: 'Hardware Requirement', val: 'Standard Camera Only' },
          { label: 'Offline Resilience', val: '100% Fully Functional' },
          { label: 'Medical Auditability', val: 'Deterministic Proofs' }
        ],
        points: [
          { title: 'Optical Biomarker + Bayesian Synergy', desc: 'Unlike simple video conference apps or text-only chatbots, CareSync bridges physical visual physiology with diagnostic modeling.' },
          { title: 'Defensible Algorithmic Pipeline', desc: 'Proprietary combination of spatial YCrCb skin clustering, time-domain rPPG autocorrelation, and Gaussian Bayesian networks.' },
          { title: 'Zero Training Data Contamination Risk', desc: 'Mathematical priors are grounded in established clinical epidemiology and peer-reviewed clinical guidelines, not internet scraped text.' }
        ],
        script: 'Our competitive moat lies in accessibility and explainability. We require no dedicated sensor hardware and no internet connection. By combining non-contact optical telemetry with transparent Bayesian mathematics, we deliver hospital-grade triage capability to the last mile.'
      },
      {
        id: 10,
        category: 'STARTUP ROADMAP & DEFENSE Q&A',
        title: 'Business Model, Regulatory Path & Defense',
        subtitle: 'Commercialization Strategy, Clinical Trials, and Anticipated Committee Inquiries',
        metrics: [
          { label: 'GTM Strategy', val: 'B2G State Health + B2B Clinics' },
          { label: 'Certification Path', val: 'CDSCO Class B Software' },
          { label: 'Subscription Model', val: '$15 – $30 / clinic / month' }
        ],
        points: [
          { title: 'Go-to-Market Milestones', desc: 'Phase 1: Academic capstone & IRB clinical pilot; Phase 2: CDSCO Class B medical software certification; Phase 3: ABDM registry rollout.' },
          { title: 'Anticipated Viva Defense Question: "Is Camera rPPG Accurate?"', desc: 'Defense Answer: "Yes. rPPG is clinically validated in IEEE and Nature Digital Medicine. In ambient light, green channel autocorrelation matches finger oximeters within ±3 bpm."' },
          { title: 'Anticipated Viva Defense Question: "Why Not Fine-Tune an LLM?"', desc: 'Defense Answer: "LLMs require multi-gigabyte VRAM, exhibit non-deterministic hallucinations, and lack continuous vital distribution modeling."' }
        ],
        script: 'CareSync AI bridges the gap between state-of-the-art clinical machine learning and real-world rural healthcare delivery. Thank you, and we welcome your questions.'
      }
    ];

    let currentIdx = 0;

    function renderSlide() {
      const s = SLIDES[currentIdx];
      document.getElementById('slide-category').textContent = s.category;
      document.getElementById('slide-num').textContent = `Slide ${s.id} of ${SLIDES.length}`;
      document.getElementById('slide-title').textContent = s.title;
      document.getElementById('slide-subtitle').textContent = s.subtitle;
      document.getElementById('slide-script').textContent = `"${s.script}"`;

      // Metrics
      const metricsContainer = document.getElementById('slide-metrics');
      metricsContainer.innerHTML = '';
      s.metrics.forEach(m => {
        const div = document.createElement('div');
        div.className = 'metric-card';
        div.innerHTML = `<span class="metric-label">${m.label}</span><strong class="metric-val">${m.val}</strong>`;
        metricsContainer.appendChild(div);
      });

      // Points
      const pointsContainer = document.getElementById('slide-points');
      pointsContainer.innerHTML = '';
      s.points.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'point-item';
        div.innerHTML = `
          <div class="point-num">${i + 1}</div>
          <div>
            <div class="point-title">${p.title}</div>
            <div class="point-desc">${p.desc}</div>
          </div>
        `;
        pointsContainer.appendChild(div);
      });

      // Navigation state
      document.getElementById('prev-btn').disabled = currentIdx === 0;
      document.getElementById('next-btn').disabled = currentIdx === SLIDES.length - 1;

      // Dots
      const dotsContainer = document.getElementById('dots-container');
      dotsContainer.innerHTML = '';
      SLIDES.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = `dot ${i === currentIdx ? 'active' : ''}`;
        dot.onclick = () => { currentIdx = i; renderSlide(); };
        dotsContainer.appendChild(dot);
      });
    }

    function prevSlide() {
      if (currentIdx > 0) {
        currentIdx--;
        renderSlide();
      }
    }

    function nextSlide() {
      if (currentIdx < SLIDES.length - 1) {
        currentIdx++;
        renderSlide();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    renderSlide();
  </script>
</body>
</html>
